<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#4da8f5">
<title>Dhani Store — Aplikasi Premium</title>
<style>
:root {
  --blue: #4da8f5;
  --blue2: #2478e8;
  --sky: #eaf6ff;
  --ink: #202938;
  --muted: #718096;
  --line: #e3eaf1;
  --surface: #fff;
  --bg: #f7f9fc;
  --shadow: 0 7px 18px #1c5b9914;
}
* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: Inter, -apple-system, BlinkMacSystemFont,
    "Segoe UI", Roboto, Arial, sans-serif;
}
button, input, select, textarea { font: inherit; }
button { cursor: pointer; }
.topbar {
  height: 5px;
  background: linear-gradient(90deg, #2d82ed, #79d4ff, #d5efff);
}
header {
  position: sticky;
  top: 0;
  z-index: 20;
  background: #ffffffed;
  border-bottom: 1px solid #e9eef5;
}
.header-inner {
  max-width: 1120px;
  margin: auto;
  padding: 14px 20px;
  display: flex;
  align-items: center;
  gap: 12px;
}
.brand {
  display: flex;
  align-items: center;
  gap: 10px;
  text-decoration: none;
  color: var(--blue2);
  font-size: clamp(23px, 4vw, 31px);
  font-weight: 850;
  margin-right: auto;
}
.logo {
  width: 41px;
  height: 41px;
  border-radius: 14px;
  background: linear-gradient(145deg, #76d2ff, #2779ed);
  display: grid;
  place-items: center;
  color: white;
  font-size: 22px;
}
main {
  max-width: 1120px;
  margin: 0 auto;
  padding: 22px 20px 112px;
}
.view { display: none; }
.view.active { display: block; }
.welcome {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 18px;
  padding: 24px;
  margin: 4px 0 23px;
  border: 1px solid #dceeff;
  border-radius: 23px;
  background: linear-gradient(120deg, #eaf6ff, #f8fcff 70%);
}
.welcome h1 {
  font-size: clamp(24px, 4vw, 34px);
  margin: 0 0 9px;
}
.welcome p {
  color: #64748b;
  font-size: 14px;
  line-height: 1.6;
}
.product-grid {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 16px;
}
.product-card {
  border: 1px solid #e4eaf1;
  border-radius: 22px;
  overflow: hidden;
  background: var(--surface);
  box-shadow: var(--shadow);
}
.product-info { padding: 13px; }
.product-info h3 { font-size: 16px; }
.price {
  font-weight: 800;
  font-size: 13px;
  color: var(--blue2);
}
.buy-btn {
  border: 0;
  background: #eaf6ff;
  color: #2478e8;
  font-weight: 750;
  border-radius: 10px;
  padding: 9px 10px;
  width: 100%;
  margin-top: 9px;
}
@media (max-width: 620px) {
  main { padding: 17px 14px 105px; }
  .product-grid {
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 12px;
  }
}
</style>
</head>
<body>
<div class="topbar"></div>
<header>
  <div class="header-inner">
    <a href="#" class="brand" id="brandHome">
      <span class="logo">♛</span>
      Dhani Store
    </a>
    <button class="icon-btn" id="themeToggle" aria-label="Ganti tema">
      ☾
    </button>
  </div>
</header>
